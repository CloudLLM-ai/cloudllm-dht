name: soak

# The soak test (tests/soak.rs): a long in-memory simulation of the DHT, hundreds
# of nodes under churn and BEP 5 / BEP 44 traffic, run for an hour of wall clock
# (tens of simulated hours) and checked for lost operations, failing lookups and
# unbounded state or memory. Weekly on Saturday and on demand; never per push.
# `make soak` is the same test locally. docs/ENGINEERING.md, "Soak test", lists
# what it asserts.
on:
  schedule:
    - cron: "0 2 * * 6"
  workflow_dispatch:
    inputs:
      seconds:
        description: Length of the run in seconds (at least 120)
        default: "3600"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  soak:
    runs-on: ubuntu-latest
    # The run, the build and the slack of a shared runner.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: Soak
        run: make soak SOAK_SECONDS=${{ inputs.seconds || 3600 }}
