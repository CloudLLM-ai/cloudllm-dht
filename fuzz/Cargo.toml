[package]
name = "cloudllm_dht-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
cloudllm_dht = { path = ".." }

# Its own workspace: keeps the fuzz crate out of the parent package's builds,
# clippy runs, MSRV check and published tarball.
[workspace]
members = ["."]

[[bin]]
name = "bdecode"
path = "fuzz_targets/bdecode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "message_parse"
path = "fuzz_targets/message_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "routing_table_ops"
path = "fuzz_targets/routing_table_ops.rs"
test = false
doc = false
bench = false

[[bin]]
name = "state_load"
path = "fuzz_targets/state_load.rs"
test = false
doc = false
bench = false

[[bin]]
name = "item_verify"
path = "fuzz_targets/item_verify.rs"
test = false
doc = false
bench = false

[[bin]]
name = "storage_ops"
path = "fuzz_targets/storage_ops.rs"
test = false
doc = false
bench = false

[[bin]]
name = "traversal_replies"
path = "fuzz_targets/traversal_replies.rs"
test = false
doc = false
bench = false

[[bin]]
name = "node_incoming"
path = "fuzz_targets/node_incoming.rs"
test = false
doc = false
bench = false
